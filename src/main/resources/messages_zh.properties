# Info Panel
info.library.title=本应用程序集成的主要库:
info.library.flatlaf.title=FlatLaf
info.library.flatlaf.desc=现代化的Look and Feel主题库\n支持亮色、暗色、IntelliJ等多种主题\n具有高DPI显示支持和平台原生感觉
info.library.miglayout.title=MiGLayout
info.library.miglayout.desc=功能强大的布局管理器\n支持复杂布局，语法简洁易懂\n适用于各种复杂的界面设计需求
info.library.rsyntaxtextarea.title=RSyntaxTextArea
info.library.rsyntaxtextarea.desc=语法高亮代码编辑器\n支持50+编程语言语法高亮\n具有代码折叠、搜索替换等功能
info.library.jfreechart.title=JFreeChart
info.library.jfreechart.desc=专业图表绘制库\n支持柱状图、饼图、线图等多种图表\n高度可定制，支持导出多种格式
info.library.pdfbox.title=Apache PDFBox
info.library.pdfbox.desc=PDF文档处理库\n支持PDF创建、编辑、内容提取\n包含多个命令行工具
info.library.ikonli.title=Ikonli
info.library.ikonli.desc=图标库系统\n支持55+图标包，如FontAwesome\n可缩放矢量图标，完美适配各种分辨率
info.library.glazedlists.title=GlazedLists
info.library.glazedlists.desc=高性能列表处理库\n支持排序、过滤、分组等功能\n与Swing表格完美集成
info.library.jgoodies_forms.title=JGoodies Forms
info.library.jgoodies_forms.desc=专业表单布局库\n提供强大的网格布局能力\n简化复杂表单的设计和实现
