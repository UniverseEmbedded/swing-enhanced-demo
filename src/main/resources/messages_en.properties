# Info Panel
info.library.title=Main Libraries Integrated in This Application:
info.library.flatlaf.title=FlatLaf
info.library.flatlaf.desc=Modern Look and Feel theme library\nSupports light, dark, IntelliJ, etc. themes\nHas high DPI display support and native platform feel
info.library.miglayout.title=MiGLayout
info.library.miglayout.desc=Powerful layout manager\nSupports complex layouts, simple and easy-to-understand syntax\nSuitable for various complex UI design requirements
info.library.rsyntaxtextarea.title=RSyntaxTextArea
info.library.rsyntaxtextarea.desc=Syntax highlighting code editor\nSupports 50+ programming language syntax highlighting\nFeatures code folding, search and replace, etc.
info.library.jfreechart.title=JFreeChart
info.library.jfreechart.desc=Professional charting library\nSupports bar, pie, line charts and more\nHighly customizable, supports export to various formats
info.library.pdfbox.title=Apache PDFBox
info.library.pdfbox.desc=PDF document processing library\nSupports PDF creation, editing, content extraction\nIncludes multiple command-line tools
info.library.ikonli.title=Ikonli
info.library.ikonli.desc=Icon library system\nSupports 55+ icon packs like FontAwesome\nScalable vector icons, perfectly adaptable to various resolutions
info.library.glazedlists.title=GlazedLists
info.library.glazedlists.desc=High-performance list processing library\nSupports sorting, filtering, grouping, etc.\nSeamlessly integrates with Swing tables
info.library.jgoodies_forms.title=JGoodies Forms
info.library.jgoodies_forms.desc=Professional form layout library\nProvides powerful grid layout capabilities\nSimplifies the design and implementation of complex forms
